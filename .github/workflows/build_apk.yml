name: Hunger Point CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: false
        default: 'debug'
        type: choice
        options: [debug, release]

env:
  FLUTTER_VERSION: '3.44.0'

jobs:
  # ── 1. Analyze & Test (gate — all builds wait for this) ──────────────────────
  analyze:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Inject google-services.json (from secret if set, else use committed file)
        run: |
          if [ -n '${{ secrets.GOOGLE_SERVICES_JSON }}' ]; then
            echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > android/app/google-services.json
          else
            echo "Using committed google-services.json"
          fi

      - run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos || true

      - name: Run tests
        run: flutter test

  # ── 2. Android Customer APK ──────────────────────────────────────────────────
  build-android:
    name: Android APK (Customer)
    runs-on: ubuntu-latest
    needs: analyze
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Inject google-services.json (from secret if set, else use committed file)
        run: |
          if [ -n '${{ secrets.GOOGLE_SERVICES_JSON }}' ]; then
            echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > android/app/google-services.json
          else
            echo "Using committed google-services.json"
          fi

      - run: flutter pub get

      - name: Build Debug APK
        if: github.event.inputs.build_type != 'release'
        run: flutter build apk --debug --target lib/main.dart --build-number=${{ github.run_number }}

      - name: Build Release APK
        if: github.event.inputs.build_type == 'release'
        run: flutter build apk --release --target lib/main.dart --build-number=${{ github.run_number }}

      - name: Get build date
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Upload Debug APK
        if: github.event.inputs.build_type != 'release'
        uses: actions/upload-artifact@v4
        with:
          name: customer-android-debug-${{ steps.date.outputs.date }}-b${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14

      - name: Upload Release APK
        if: github.event.inputs.build_type == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: customer-android-release-${{ steps.date.outputs.date }}-b${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Build Summary
        run: |
          echo "## Customer Android Build ✅" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Build # | ${{ github.run_number }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Type | ${{ github.event.inputs.build_type || 'debug' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Date | $(date +'%Y-%m-%d') |" >> $GITHUB_STEP_SUMMARY

  # ── 3. Android Rider APK (skips until Day 3 — main_rider.dart created) ───────
  build-rider:
    name: Android APK (Rider)
    runs-on: ubuntu-latest
    needs: analyze
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Inject google-services.json (from secret if set, else use committed file)
        run: |
          if [ -n '${{ secrets.GOOGLE_SERVICES_JSON }}' ]; then
            echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > android/app/google-services.json
          else
            echo "Using committed google-services.json"
          fi

      - run: flutter pub get

      - name: Build Rider APK
        id: rider_build
        run: |
          if [ -f "lib/main_rider.dart" ]; then
            flutter build apk --debug --target lib/main_rider.dart --build-number=${{ github.run_number }}
            echo "built=true" >> $GITHUB_OUTPUT
          else
            echo "Rider app not yet created (Day 3) — skipping"
            echo "built=false" >> $GITHUB_OUTPUT
          fi

      - name: Get build date
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Upload Rider APK
        if: steps.rider_build.outputs.built == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: rider-android-debug-${{ steps.date.outputs.date }}-b${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14

  # ── 4. Android Owner APK (skips until Day 4 — main_owner.dart created) ───────
  build-owner:
    name: Android APK (Owner)
    runs-on: ubuntu-latest
    needs: analyze
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Inject google-services.json (from secret if set, else use committed file)
        run: |
          if [ -n '${{ secrets.GOOGLE_SERVICES_JSON }}' ]; then
            echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > android/app/google-services.json
          else
            echo "Using committed google-services.json"
          fi

      - run: flutter pub get

      - name: Build Owner APK
        id: owner_build
        run: |
          if [ -f "lib/main_owner.dart" ]; then
            flutter build apk --debug --target lib/main_owner.dart --build-number=${{ github.run_number }}
            echo "built=true" >> $GITHUB_OUTPUT
          else
            echo "Owner app not yet created (Day 4) — skipping"
            echo "built=false" >> $GITHUB_OUTPUT
          fi

      - name: Get build date
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Upload Owner APK
        if: steps.owner_build.outputs.built == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: owner-android-debug-${{ steps.date.outputs.date }}-b${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14

  # ── 5. iOS IPA (unsigned — sideload via AltStore / Sideloadly) ───────────────
  build-ios:
    name: iOS IPA (unsigned)
    runs-on: macos-latest
    needs: analyze
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Generate iOS project structure
        run: flutter create --platforms=ios . 2>/dev/null || true

      - name: Restore Info.plist with app permissions
        run: |
          cat > ios/Runner/Info.plist << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleDevelopmentRegion</key>
            <string>$(DEVELOPMENT_LANGUAGE)</string>
            <key>CFBundleDisplayName</key>
            <string>Hunger Point</string>
            <key>CFBundleExecutable</key>
            <string>$(EXECUTABLE_NAME)</string>
            <key>CFBundleIdentifier</key>
            <string>$(PRODUCT_BUNDLE_IDENTIFIER)</string>
            <key>CFBundleInfoDictionaryVersion</key>
            <string>6.0</string>
            <key>CFBundleName</key>
            <string>hunger_point</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>$(FLUTTER_BUILD_NAME)</string>
            <key>CFBundleSignature</key>
            <string>????</string>
            <key>CFBundleVersion</key>
            <string>$(FLUTTER_BUILD_NUMBER)</string>
            <key>LSRequiresIPhoneOS</key>
            <true/>
            <key>UILaunchStoryboardName</key>
            <string>LaunchScreen</string>
            <key>UIMainStoryboardFile</key>
            <string>Main</string>
            <key>UISupportedInterfaceOrientations</key>
            <array>
              <string>UIInterfaceOrientationPortrait</string>
              <string>UIInterfaceOrientationLandscapeLeft</string>
              <string>UIInterfaceOrientationLandscapeRight</string>
            </array>
            <key>UIViewControllerBasedStatusBarAppearance</key>
            <false/>
            <key>NSLocationWhenInUseUsageDescription</key>
            <string>Hunger Point uses your location to auto-detect your delivery address.</string>
            <key>NSLocationAlwaysAndWhenInUseUsageDescription</key>
            <string>Hunger Point uses your location to track your order delivery in real time.</string>
            <key>NSPhotoLibraryUsageDescription</key>
            <string>Hunger Point needs access to your photos to let you set a profile picture.</string>
            <key>NSPhotoLibraryAddUsageDescription</key>
            <string>Hunger Point may save images to your photo library.</string>
            <key>NSCameraUsageDescription</key>
            <string>Hunger Point needs camera access to let you take a profile photo.</string>
            <key>FirebaseAppDelegateProxyEnabled</key>
            <false/>
          </dict>
          </plist>
          PLIST

      - name: Fix Generated.xcconfig for macOS paths
        run: |
          FLUTTER_ROOT=$(dirname $(dirname $(which flutter)))
          APP_PATH=$(pwd)
          echo "// This is a generated file; do not edit or check into version control." > ios/Flutter/Generated.xcconfig
          echo "FLUTTER_ROOT=$FLUTTER_ROOT"                                             >> ios/Flutter/Generated.xcconfig
          echo "FLUTTER_APPLICATION_PATH=$APP_PATH"                                     >> ios/Flutter/Generated.xcconfig
          echo "COCOAPODS_PARALLEL_CODE_SIGN=true"                                      >> ios/Flutter/Generated.xcconfig
          echo "FLUTTER_TARGET=lib/main.dart"                                           >> ios/Flutter/Generated.xcconfig
          echo "FLUTTER_BUILD_DIR=build"                                                >> ios/Flutter/Generated.xcconfig
          echo "FLUTTER_BUILD_NAME=1.0.0"                                               >> ios/Flutter/Generated.xcconfig
          echo "FLUTTER_BUILD_NUMBER=${{ github.run_number }}"                          >> ios/Flutter/Generated.xcconfig
          echo "EXCLUDED_ARCHS[sdk=iphonesimulator*]=i386"                              >> ios/Flutter/Generated.xcconfig
          echo "EXCLUDED_ARCHS[sdk=iphoneos*]=armv7"                                    >> ios/Flutter/Generated.xcconfig
          echo "DART_OBFUSCATION=false"                                                 >> ios/Flutter/Generated.xcconfig
          echo "TRACK_WIDGET_CREATION=true"                                             >> ios/Flutter/Generated.xcconfig
          echo "TREE_SHAKE_ICONS=false"                                                 >> ios/Flutter/Generated.xcconfig
          echo "PACKAGE_CONFIG=.dart_tool/package_config.json"                         >> ios/Flutter/Generated.xcconfig

      - name: Install CocoaPods
        run: cd ios && pod install --repo-update
        env:
          LANG: en_US.UTF-8

      - name: Disable code signing in Xcode project
        run: |
          find ios -name "*.pbxproj" -exec sed -i '' \
            -e 's/DEVELOPMENT_TEAM = [^;]*;/DEVELOPMENT_TEAM = "";/g' \
            -e 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' \
            -e 's/PROVISIONING_PROFILE_SPECIFIER = [^;]*;/PROVISIONING_PROFILE_SPECIFIER = "";/g' \
            -e 's/CODE_SIGNING_REQUIRED = YES;/CODE_SIGNING_REQUIRED = NO;/g' \
            {} \;

      - name: Build iOS app (no codesign)
        run: flutter build ios --debug --no-codesign --build-number=${{ github.run_number }}

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r HungerPoint-iOS-debug.ipa Payload/
          rm -rf Payload

      - name: Get build date
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: customer-ios-debug-${{ steps.date.outputs.date }}-b${{ github.run_number }}
          path: HungerPoint-iOS-debug.ipa
          retention-days: 14

      - name: Build Summary
        run: |
          echo "## iOS Build ✅" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Build # | ${{ github.run_number }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Type | debug (unsigned) |" >> $GITHUB_STEP_SUMMARY
          echo "| Date | $(date +'%Y-%m-%d') |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> Install via **AltStore** or **Sideloadly** using your Apple ID." >> $GITHUB_STEP_SUMMARY

  # ── 6. GitHub Release (on version tags: git tag v1.0.0 && git push --tags) ───
  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [build-android, build-ios]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Inject google-services.json (from secret if set, else use committed file)
        run: |
          if [ -n '${{ secrets.GOOGLE_SERVICES_JSON }}' ]; then
            echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > android/app/google-services.json
          else
            echo "Using committed google-services.json"
          fi

      - run: flutter pub get

      - name: Build Customer Release APK
        run: flutter build apk --release --target lib/main.dart

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
          name: Hunger Point ${{ github.ref_name }}
          body: |
            ## Hunger Point ${{ github.ref_name }}

            Download the APK below and install on your Android device.
            Enable "Install from unknown sources" if prompted.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
